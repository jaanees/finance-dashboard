<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f11;
    --surface: #16181c;
    --surface2: #1e2026;
    --border: #2a2d35;
    --text: #e8e9ec;
    --muted: #6b7080;
    --green: #3ddc84;
    --red: #ff5c5c;
    --amber: #f5a623;
    --blue: #5b9cf6;
    --accent: #3ddc84;
  }

- { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: var(–bg);
color: var(–text);
font-family: ‘DM Mono’, monospace;
min-height: 100vh;
padding: 24px 16px 48px;
}

.header {
text-align: center;
margin-bottom: 32px;
padding-top: 12px;
}

.header h1 {
font-family: ‘DM Serif Display’, serif;
font-size: 2rem;
font-weight: 400;
letter-spacing: -0.02em;
color: var(–text);
}

.header .subtitle {
font-size: 0.7rem;
color: var(–muted);
letter-spacing: 0.15em;
text-transform: uppercase;
margin-top: 4px;
}

.month-nav {
display: flex;
align-items: center;
justify-content: center;
gap: 16px;
margin-bottom: 28px;
}

.month-nav button {
background: var(–surface2);
border: 1px solid var(–border);
color: var(–text);
width: 32px;
height: 32px;
border-radius: 50%;
cursor: pointer;
font-size: 0.85rem;
transition: all 0.2s;
display: flex; align-items: center; justify-content: center;
}

.month-nav button:hover { background: var(–border); }

.month-label {
font-family: ‘DM Serif Display’, serif;
font-size: 1.1rem;
min-width: 140px;
text-align: center;
}

/* API key setup screen */
.setup-screen {
max-width: 480px;
margin: 0 auto;
padding: 32px 24px;
background: var(–surface);
border: 1px solid var(–border);
border-radius: 16px;
}

.setup-screen h2 {
font-family: ‘DM Serif Display’, serif;
font-size: 1.4rem;
font-weight: 400;
margin-bottom: 8px;
}

.setup-screen p {
font-size: 0.72rem;
color: var(–muted);
line-height: 1.7;
margin-bottom: 20px;
}

.input-group { margin-bottom: 16px; }
.input-group label {
display: block;
font-size: 0.65rem;
letter-spacing: 0.12em;
text-transform: uppercase;
color: var(–muted);
margin-bottom: 6px;
}

.input-group input, .input-group select {
width: 100%;
background: var(–surface2);
border: 1px solid var(–border);
color: var(–text);
padding: 10px 14px;
border-radius: 8px;
font-family: ‘DM Mono’, monospace;
font-size: 0.72rem;
outline: none;
transition: border-color 0.2s;
}

.input-group input:focus, .input-group select:focus {
border-color: var(–accent);
}

.btn {
width: 100%;
padding: 12px;
background: var(–accent);
color: #0e0f11;
border: none;
border-radius: 8px;
font-family: ‘DM Mono’, monospace;
font-size: 0.75rem;
font-weight: 500;
letter-spacing: 0.08em;
cursor: pointer;
transition: opacity 0.2s;
}

.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-secondary {
background: var(–surface2);
color: var(–text);
border: 1px solid var(–border);
margin-top: 8px;
}

.loading {
text-align: center;
padding: 48px 0;
}

.spinner {
width: 32px;
height: 32px;
border: 2px solid var(–border);
border-top-color: var(–accent);
border-radius: 50%;
animation: spin 0.8s linear infinite;
margin: 0 auto 16px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading p { font-size: 0.72rem; color: var(–muted); }

/* Dashboard */
.dashboard { max-width: 480px; margin: 0 auto; }

/* Hero card */
.hero-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 16px;
padding: 24px;
margin-bottom: 16px;
text-align: center;
position: relative;
overflow: hidden;
}

.hero-card::before {
content: ‘’;
position: absolute;
top: -40px; left: 50%;
transform: translateX(-50%);
width: 200px; height: 200px;
border-radius: 50%;
opacity: 0.04;
}

.hero-card.positive::before { background: var(–green); }
.hero-card.negative::before { background: var(–red); }

.hero-label {
font-size: 0.62rem;
letter-spacing: 0.15em;
text-transform: uppercase;
color: var(–muted);
margin-bottom: 8px;
}

.hero-amount {
font-family: ‘DM Serif Display’, serif;
font-size: 3rem;
font-weight: 400;
line-height: 1;
margin-bottom: 6px;
}

.hero-amount.positive { color: var(–green); }
.hero-amount.negative { color: var(–red); }

.hero-sub {
font-size: 0.68rem;
color: var(–muted);
}

/* Section */
.section-title {
font-size: 0.62rem;
letter-spacing: 0.15em;
text-transform: uppercase;
color: var(–muted);
margin: 24px 0 10px;
padding: 0 2px;
}

/* Budget rows */
.budget-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 12px;
padding: 14px 16px;
margin-bottom: 8px;
}

.budget-row {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 8px;
}

.budget-name {
font-size: 0.75rem;
color: var(–text);
}

.budget-status {
font-size: 0.72rem;
font-weight: 500;
}

.budget-status.over { color: var(–red); }
.budget-status.under { color: var(–green); }
.budget-status.even { color: var(–muted); }

.progress-bar {
height: 3px;
background: var(–border);
border-radius: 2px;
overflow: hidden;
}

.progress-fill {
height: 100%;
border-radius: 2px;
transition: width 0.6s ease;
}

.progress-fill.over { background: var(–red); }
.progress-fill.under { background: var(–green); }

.budget-meta {
display: flex;
justify-content: space-between;
margin-top: 6px;
font-size: 0.62rem;
color: var(–muted);
}

/* Savings card */
.savings-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 12px;
padding: 20px;
margin-bottom: 8px;
}

.savings-header {
display: flex;
justify-content: space-between;
align-items: flex-start;
margin-bottom: 14px;
}

.savings-title { font-size: 0.75rem; }
.savings-pct {
font-family: ‘DM Serif Display’, serif;
font-size: 1.6rem;
color: var(–accent);
line-height: 1;
}

.savings-bar {
height: 6px;
background: var(–border);
border-radius: 3px;
overflow: hidden;
margin-bottom: 10px;
}

.savings-fill {
height: 100%;
background: var(–accent);
border-radius: 3px;
transition: width 0.8s ease;
}

.savings-nums {
display: flex;
justify-content: space-between;
font-size: 0.62rem;
color: var(–muted);
}

.savings-nums span:first-child { color: var(–text); }

/* Account cards */
.account-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 12px;
padding: 14px 16px;
margin-bottom: 8px;
display: flex;
justify-content: space-between;
align-items: center;
}

.account-name {
font-size: 0.72rem;
color: var(–text);
margin-bottom: 2px;
}

.account-type {
font-size: 0.6rem;
color: var(–muted);
letter-spacing: 0.08em;
text-transform: uppercase;
}

.account-balance {
font-family: ‘DM Serif Display’, serif;
font-size: 1.1rem;
text-align: right;
}

.total-row {
display: flex;
justify-content: space-between;
align-items: center;
padding: 14px 16px;
border-top: 1px solid var(–border);
margin-top: 4px;
}

.total-label { font-size: 0.65rem; color: var(–muted); letter-spacing: 0.1em; text-transform: uppercase; }
.total-amount { font-family: ‘DM Serif Display’, serif; font-size: 1.3rem; color: var(–accent); }

.error-msg {
background: rgba(255,92,92,0.08);
border: 1px solid rgba(255,92,92,0.2);
border-radius: 8px;
padding: 12px 16px;
font-size: 0.7rem;
color: var(–red);
margin-bottom: 16px;
line-height: 1.6;
}

.refresh-row {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 20px;
}

.refresh-btn {
background: var(–surface2);
border: 1px solid var(–border);
color: var(–muted);
padding: 6px 14px;
border-radius: 20px;
font-family: ‘DM Mono’, monospace;
font-size: 0.65rem;
cursor: pointer;
transition: all 0.2s;
letter-spacing: 0.05em;
}

.refresh-btn:hover { color: var(–text); border-color: var(–text); }

.last-updated { font-size: 0.6rem; color: var(–muted); }

.change-token {
text-align: center;
margin-top: 24px;
}

.change-token button {
background: none;
border: none;
color: var(–muted);
font-family: ‘DM Mono’, monospace;
font-size: 0.65rem;
cursor: pointer;
text-decoration: underline;
text-underline-offset: 3px;
}

.dot {
display: inline-block;
width: 6px; height: 6px;
border-radius: 50%;
margin-right: 6px;
vertical-align: middle;
}

.dot.green { background: var(–green); }
.dot.red { background: var(–red); }
.dot.amber { background: var(–amber); }

@keyframes fadeIn {
from { opacity: 0; transform: translateY(8px); }
to { opacity: 1; transform: translateY(0); }
}

.fade-in { animation: fadeIn 0.4s ease forwards; }

.stagger-1 { animation-delay: 0.05s; opacity: 0; }
.stagger-2 { animation-delay: 0.1s; opacity: 0; }
.stagger-3 { animation-delay: 0.15s; opacity: 0; }
.stagger-4 { animation-delay: 0.2s; opacity: 0; }
.stagger-5 { animation-delay: 0.25s; opacity: 0; }
</style>

</head>
<body>

<div class="header">
  <h1>Finance Dashboard</h1>
  <div class="subtitle">Powered by Wallet · BudgetBakers</div>
</div>

<div id="app"></div>

<script>
const SAVINGS_BUDGET_NAME = 'Savings';
const SAVINGS_TARGET = 2500;
const SAVINGS_CATEGORY = 'Savings'; // category used in Investments/transfers

// Accounts to treat as savings (Amboy)
const SAVINGS_ACCOUNTS = ['amboy'];

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

let apiToken = localStorage.getItem('wallet_token') || '';
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth(); // 0-indexed

function getMonthRange(year, month) {
  const from = ${year}-${String(month+1).padStart(2,'0')}-01;
  const lastDay = new Date(year, month+1, 0).getDate();
  const to = ${year}-${String(month+1).padStart(2,'0')}-${lastDay};
  return { from, to };
}

async function walletFetch(endpoint, params = {}) {
  const url = new URL(https://api.budgetbakers.com/api/v1/${endpoint});
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString(), {
    headers: { 'X-Token': apiToken, 'Content-Type': 'application/json' }
  });
  if (!res.ok) throw new Error(API error ${res.status});
  return res.json();
}

async function loadDashboard() {
  const app = document.getElementById('app');
  app.innerHTML = <div class="loading"><div class="spinner"></div><p>Fetching your data...</p></div>;

  try {
    const { from, to } = getMonthRange(currentYear, currentMonth);

    // Fetch accounts, budgets, records in parallel
    const [accounts, records, budgets] = await Promise.all([
      walletFetch('accounts').catch(e => ({ error: e.message })),
      walletFetch('records', { dateFrom: from, dateTo: to, pageSize: 10 }).catch(e => ({ error: e.message })),
      walletFetch('budgets').catch(e => ({ error: e.message }))
    ]);

    // DEBUG — show raw API structure
    const debugInfo = {
      recordCount: Array.isArray(records) ? records.length : records,
      firstRecord: Array.isArray(records) && records.length > 0 ? records[0] : records,
      budgetCount: Array.isArray(budgets) ? budgets.length : budgets,
      firstBudget: Array.isArray(budgets) && budgets.length > 0 ? budgets[0] : budgets,
      accountCount: Array.isArray(accounts) ? accounts.length : accounts,
      firstAccount: Array.isArray(accounts) && accounts.length > 0 ? accounts[0] : accounts,
    };
    app.innerHTML = `
      <div style="max-width:480px;margin:0 auto;background:#16181c;border:1px solid #2a2d35;border-radius:12px;padding:16px;font-family:'DM Mono',monospace;font-size:0.62rem;color:#e8e9ec;white-space:pre-wrap;word-break:break-all;line-height:1.8">
        <div style="color:#3ddc84;margin-bottom:12px;font-size:0.7rem;letter-spacing:0.1em">DEBUG — RAW API STRUCTURE</div>
        ${JSON.stringify(debugInfo, null, 2)}
      </div>`;
    return;
  } catch(err) {
    app.innerHTML = `
      <div class="error-msg">⚠ Could not load data. Check your API token or try refreshing.<br><small>${err.message}</small></div>
      <button class="btn btn-secondary" onclick="showSetup()">Update API Token</button>
    `;
  }
}

function formatGBP(n) {
  const abs = Math.abs(n);
  const formatted = abs.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (n < 0 ? '-' : '') + '£' + formatted;
}

function renderDashboard(accounts, records, budgets, from, to) {
  const app = document.getElementById('app');

  // --- NET BUDGET POSITION ---
  // Find the savings budget and exclude it from net calc
  let totalOverspend = 0;
  let totalUnderspend = 0;
  const budgetRows = [];

  // Try to get budget data from API, fallback to screenshot data
  const budgetList = Array.isArray(budgets) && budgets.length > 0 ? budgets : getHardcodedBudgets();

  budgetList.forEach(b => {
    if (!b.name) return;
    if (b.name.toLowerCase() === SAVINGS_BUDGET_NAME.toLowerCase()) return; // exclude savings

    const limit = b.limit || b.amount || 0;
    // Sum transactions for this budget category
    const spent = records
      .filter(r => r.categoryId === b.categoryId || (r.category && r.category.name === b.name))
      .reduce((sum, r) => sum + Math.abs(r.amount || 0), 0);

    const diff = limit - spent; // positive = underspend, negative = overspend
    if (diff < 0) totalOverspend += Math.abs(diff);
    else totalUnderspend += diff;

    budgetRows.push({ name: b.name, limit, spent, diff });
  });

  const netPosition = totalUnderspend - totalOverspend;

  // --- SAVINGS ---
  // Sum all transactions in Savings category this month
  const savingsDeposited = records
    .filter(r => {
      const cat = (r.category && r.category.name) || r.categoryName || '';
      return cat.toLowerCase().includes('saving');
    })
    .reduce((sum, r) => sum + Math.abs(r.amount || 0), 0);

  const savingsPct = Math.min(100, Math.round((savingsDeposited / SAVINGS_TARGET) * 100));

  // --- ACCOUNTS ---
  const accountList = Array.isArray(accounts) ? accounts : [];

  // Separate savings vs spending accounts
  const savingsAccs = accountList.filter(a => SAVINGS_ACCOUNTS.some(s => (a.name||'').toLowerCase().includes(s)));
  const spendingAccs = accountList.filter(a => !SAVINGS_ACCOUNTS.some(s => (a.name||'').toLowerCase().includes(s)));

  const totalSavings = savingsAccs.reduce((s, a) => s + (a.balance || 0), 0);
  const totalSpending = spendingAccs.reduce((s, a) => s + (a.balance || 0), 0);

  const now = new Date();
  const timeStr = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

  // Build budget rows HTML
  let budgetRowsHTML = budgetRows.length > 0 ? budgetRows.map(b => {
    const pct = Math.min(100, (b.spent / b.limit) * 100);
    const isOver = b.diff < 0;
    const statusText = isOver ? −£${Math.abs(b.diff).toFixed(2)} over : +£${b.diff.toFixed(2)} left;
    return `
      <div class="budget-card fade-in stagger-3">
        <div class="budget-row">
          <span class="budget-name"><span class="dot ${isOver ? 'red' : 'green'}"></span>${b.name}</span>
          <span class="budget-status ${isOver ? 'over' : 'under'}">${statusText}</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill ${isOver ? 'over' : 'under'}" style="width:${pct}%"></div>
        </div>
        <div class="budget-meta">
          <span>£${b.spent.toFixed(2)} spent</span>
          <span>of £${b.limit.toFixed(2)}</span>
        </div>
      </div>`;
  }).join('') : <div class="budget-card"><p style="font-size:0.72rem;color:var(--muted);text-align:center;padding:8px 0">No budget data found for this month</p></div>;

  let accountRowsHTML = '';
  if (spendingAccs.length > 0) {
    accountRowsHTML += spendingAccs.map(a => `
      <div class="account-card fade-in stagger-4">
        <div>
          <div class="account-name">${a.name || 'Account'}</div>
          <div class="account-type">current</div>
        </div>
        <div class="account-balance">${formatGBP(a.balance || 0)}</div>
      </div>`).join('');
  }

  if (savingsAccs.length > 0) {
    accountRowsHTML += savingsAccs.map(a => `
      <div class="account-card fade-in stagger-4">
        <div>
          <div class="account-name">${a.name || 'Account'}</div>
          <div class="account-type">savings</div>
        </div>
        <div class="account-balance" style="color:var(--accent)">${formatGBP(a.balance || 0)}</div>
      </div>`).join('');
  }

  app.innerHTML = `
    <div class="dashboard">
      <div class="month-nav">
        <button onclick="prevMonth()">&#8249;</button>
        <span class="month-label">${MONTHS[currentMonth]} ${currentYear}</span>
        <button onclick="nextMonth()">&#8250;</button>
      </div>

      <div class="refresh-row">
        <span class="last-updated">Updated ${timeStr}</span>
        <button class="refresh-btn" onclick="loadDashboard()">↻ Refresh</button>
      </div>

      <!-- NET BUDGET POSITION -->
      <div class="hero-card ${netPosition >= 0 ? 'positive' : 'negative'} fade-in stagger-1">
        <div class="hero-label">Net Budget Position</div>
        <div class="hero-amount ${netPosition >= 0 ? 'positive' : 'negative'}">${formatGBP(netPosition)}</div>
        <div class="hero-sub">${netPosition >= 0 ? '↑ under budget overall' : '↓ over budget overall'} · £${totalOverspend.toFixed(2)} over, £${totalUnderspend.toFixed(2)} under</div>
      </div>

      <!-- SAVINGS PROGRESS -->
      <div class="section-title">Savings this month</div>
      <div class="savings-card fade-in stagger-2">
        <div class="savings-header">
          <div>
            <div class="savings-title">Monthly Savings Target</div>
            <div style="font-size:0.65rem;color:var(--muted);margin-top:3px">${savingsPct >= 100 ? '🎉 Target reached!' : £${(SAVINGS_TARGET - savingsDeposited).toFixed(2)} remaining}</div>
          </div>
          <div class="savings-pct">${savingsPct}%</div>
        </div>
        <div class="savings-bar">
          <div class="savings-fill" style="width:${savingsPct}%"></div>
        </div>
        <div class="savings-nums">
          <span>£${savingsDeposited.toFixed(2)} deposited</span>
          <span>target £${SAVINGS_TARGET.toLocaleString()}</span>
        </div>
      </div>

      <!-- BUDGET BREAKDOWN -->
      <div class="section-title">Budget breakdown</div>
      ${budgetRowsHTML}

      <!-- ACCOUNTS -->
      <div class="section-title">Account balances</div>
      ${accountRowsHTML || '<div class="budget-card"><p style="font-size:0.72rem;color:var(--muted);text-align:center;padding:8px 0">No accounts found</p></div>'}

      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0 16px;margin-bottom:8px">
        <div class="total-row">
          <span class="total-label">Total across all accounts</span>
          <span class="total-amount">${formatGBP(totalSavings + totalSpending)}</span>
        </div>
      </div>

      <div class="change-token">
        <button onclick="showSetup()">change API token</button>
      </div>
    </div>
  `;
}

function getHardcodedBudgets() {
  // Fallback if API doesn't return budgets — uses your screenshot data
  return [
    { name: 'Eating Out', limit: 400 },
    { name: 'Events', limit: 100 },
    { name: 'Groceries + Essentials', limit: 300 },
    { name: 'Miscellaneous', limit: 100 },
    { name: 'Phone', limit: 10 },
    { name: 'Rent', limit: 1225 },
    { name: 'Shopping', limit: 300 },
    { name: 'Subscriptions', limit: 120 },
    { name: 'Tax', limit: 157 },
    { name: 'Tithe', limit: 700 },
    { name: 'Transport', limit: 100 },
    { name: 'Utilities', limit: 230 },
  ];
}

function prevMonth() {
  if (currentMonth === 0) { currentMonth = 11; currentYear--; }
  else currentMonth--;
  loadDashboard();
}

function nextMonth() {
  const now = new Date();
  if (currentYear === now.getFullYear() && currentMonth === now.getMonth()) return;
  if (currentMonth === 11) { currentMonth = 0; currentYear++; }
  else currentMonth++;
  loadDashboard();
}

function showSetup() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="setup-screen">
      <h2>Connect your Wallet</h2>
      <p>Paste your BudgetBakers API token below. This is stored only on your device and never sent anywhere except the Wallet API.</p>
      <div class="input-group">
        <label>API Token</label>
        <input type="password" id="tokenInput" placeholder="Paste your token here" value="${apiToken}" />
      </div>
      <button class="btn" id="connectBtn" onclick="saveToken()">Connect & Load Dashboard</button>
    </div>
  `;
}

function saveToken() {
  const val = document.getElementById('tokenInput').value.trim();
  if (!val) return;
  apiToken = val;
  localStorage.setItem('wallet_token', val);
  loadDashboard();
}

// Init
if (apiToken) {
  loadDashboard();
} else {
  showSetup();
}
</script>

</body>
</html>
